name: Fix modern UI width

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-modern-width.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match quick-start width to main content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = r'''
          <style id="getnick-modern-width-fix">
          .modern-launcher {
            width: calc(100% - 60px) !important;
            max-width: none !important;
            margin: 0 auto 1.5rem !important;
            box-sizing: border-box !important;
          }
          @media (max-width: 760px) {
            .modern-launcher {
              width: calc(100% - 24px) !important;
            }
          }
          </style>
          '''
          for filename in ('index.html', 'mainmenu.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              start = '<style id="getnick-modern-width-fix">'
              end = '</style>'
              if start in text:
                  before, rest = text.split(start, 1)
                  _, after = rest.split(end, 1)
                  text = before + css + after
              else:
                  text = text.replace('</head>', css + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'GetNick UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mainmenu.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Match quick-start width to main content'
            git push
          fi
