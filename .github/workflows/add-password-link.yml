name: Add password generator link

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/add-password-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add password link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle='''    <a class="modern-action" href="/minecraft-niki.html">⛏️ Minecraft</a>'''
          replacement=needle + '''\n    <a class="modern-action" href="/generator-paroley.html">🔐 Пароли</a>'''
          for filename in ('index.html', 'mainmenu.html'):
              p=Path(filename)
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              if '/generator-paroley.html' not in text and needle in text:
                  text=text.replace(needle,replacement,1)
                  p.write_text(text,encoding='utf-8')
          p=Path('sitemap.xml')
          if p.exists():
              text=p.read_text(encoding='utf-8')
              if 'generator-paroley.html' not in text:
                  marker='</urlset>'
                  entry='''  <url>\n    <loc>https://getnick.ru/generator-paroley.html</loc>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n'''
                  if marker in text:
                      text=text.replace(marker,entry+marker,1)
                      p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'GetNick UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mainmenu.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add password generator link to site'
            git push
          fi
