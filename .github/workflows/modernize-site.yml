name: Modernize site UI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/modernize-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage and generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = r'''
          /* GETNICK MODERN UI V1 */
          .modern-launcher {
            width: calc(100% - 3rem);
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            overflow: hidden;
            margin-top: 0;
            margin-bottom: 1.5rem;
            padding: 1.1rem;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(99,102,241,.16), rgba(236,72,153,.10) 55%, rgba(6,182,212,.08));
            box-shadow: 0 18px 45px rgba(0,0,0,.14);
            backdrop-filter: blur(16px);
          }
          .modern-launcher::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            right: -70px;
            top: -90px;
            border-radius: 999px;
            background: rgba(99,102,241,.22);
            filter: blur(30px);
            pointer-events: none;
          }
          .modern-launcher-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: .8rem;
            position: relative;
            z-index: 1;
          }
          .modern-launcher-title {
            font-weight: 800;
            letter-spacing: -.02em;
            color: var(--text-main);
          }
          .modern-launcher-subtitle {
            font-size: .84rem;
            color: var(--text-muted);
          }
          .modern-launcher-actions {
            display: grid;
            grid-template-columns: repeat(4, minmax(0,1fr));
            gap: .65rem;
            position: relative;
            z-index: 1;
          }
          .modern-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 42px;
            padding: .65rem .8rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.045);
            color: var(--text-main);
            text-decoration: none;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .18s ease, border-color .18s ease, background .18s ease;
          }
          .modern-action:hover {
            transform: translateY(-2px);
            border-color: rgba(165,180,252,.45);
            background: rgba(255,255,255,.08);
          }
          .modern-action.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: transparent;
            box-shadow: 0 10px 25px rgba(99,102,241,.25);
          }
          .modern-mini-note {
            margin-top: .75rem;
            font-size: .78rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
          }
          .modern-toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translate(-50%, 18px);
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            padding: .72rem 1rem;
            border-radius: 12px;
            background: rgba(15,23,42,.92);
            color: #fff;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 16px 40px rgba(0,0,0,.28);
            backdrop-filter: blur(12px);
            font-size: .86rem;
            font-weight: 700;
            transition: opacity .2s ease, transform .2s ease;
          }
          .modern-toast.show { opacity: 1; transform: translate(-50%, 0); }
          @media (max-width: 760px) {
            .modern-launcher { width: calc(100% - 2rem); }
            .modern-launcher-actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .modern-launcher-head { align-items: flex-start; flex-direction: column; }
          }
          @media (prefers-reduced-motion: reduce) {
            .modern-action, .modern-toast { transition: none; }
          }
          '''

          html = r'''
          <!-- GETNICK MODERN UI V1 -->
          <section class="modern-launcher" aria-label="Быстрый доступ к генератору и популярным разделам">
            <div class="modern-launcher-head">
              <div>
                <div class="modern-launcher-title">⚡ Быстрый старт</div>
                <div class="modern-launcher-subtitle">Генерируй ник в один клик или сразу выбери игру</div>
              </div>
              <div class="modern-launcher-subtitle">Без регистрации</div>
            </div>
            <div class="modern-launcher-actions">
              <button class="modern-action primary" type="button" data-modern-random>🎲 Случайный ник</button>
              <a class="modern-action" href="/steam-niki.html">🎮 Steam</a>
              <a class="modern-action" href="/roblox-niki.html">🟦 Roblox</a>
              <a class="modern-action" href="/minecraft-niki.html">⛏️ Minecraft</a>
            </div>
            <div class="modern-mini-note">Также доступны страницы для Valorant и Twitch — всё в одном стиле GetNick.</div>
          </section>
          <div class="modern-toast" id="modernToast" role="status" aria-live="polite"></div>
          <script>
          (() => {
            const toast = (message) => {
              const el = document.getElementById('modernToast');
              if (!el) return;
              el.textContent = message;
              el.classList.add('show');
              clearTimeout(window.__getnickToastTimer);
              window.__getnickToastTimer = setTimeout(() => el.classList.remove('show'), 1500);
            };
            const goToGenerator = () => {
              const target = document.querySelector('.hero-display') || document.querySelector('.main-nick-wrapper') || document.querySelector('.controls-grid');
              target?.scrollIntoView({ behavior: 'smooth', block: 'center' });
              const button = document.querySelector('.btn-primary');
              if (button && typeof button.click === 'function') {
                setTimeout(() => button.click(), 350);
              }
            };
            document.querySelector('[data-modern-random]')?.addEventListener('click', goToGenerator);
            document.addEventListener('click', (event) => {
              const button = event.target.closest('button');
              if (!button) return;
              const label = (button.innerText || '').trim().toLowerCase();
              if (label.includes('скоп') && !button.disabled) {
                setTimeout(() => toast('✅ Ник скопирован'), 40);
              }
            });
          })();
          </script>
          '''

          for filename in ('index.html', 'mainmenu.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'GETNICK MODERN UI V1' not in text:
                  text = text.replace('</head>', '<style>\n' + css + '\n</style>\n</head>', 1)
                  marker = '<!-- Cookie Баннер -->'
                  if marker in text:
                      text = text.replace(marker, html + '\n\n' + marker, 1)
                  else:
                      text = text.replace('</body>', html + '\n</body>', 1)
                  p.write_text(text, encoding='utf-8')
              else:
                  # Existing UI: insert the width fix before the existing launcher CSS ends.
                  text = text.replace('.modern-launcher {\n  position: relative;', '.modern-launcher {\n  width: calc(100% - 3rem);\n  max-width: 1100px;\n  margin-left: auto;\n  margin-right: auto;\n  position: relative;', 1)
                  text = text.replace('.modern-launcher {\n            position: relative;', '.modern-launcher {\n            width: calc(100% - 3rem);\n            max-width: 1100px;\n            margin-left: auto;\n            margin-right: auto;\n            position: relative;', 1)
                  p.write_text(text, encoding='utf-8')

          PY

      - name: Commit modern UI
        shell: bash
        run: |
          git config user.name 'GetNick UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html mainmenu.html
          if git diff --cached --quiet; then
            echo 'No UI changes to commit.'
          else
            git commit -m 'Constrain modern quick-start width'
            git push
          fi
