name: Remove unwanted SEO block

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/remove-seo-block.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove SEO content block
        shell: python
        run: |
          from pathlib import Path
          import re

          marker = 'Генератор ников онлайн — создайте уникальный ник'

          for name in ('index.html', 'mainmenu.html'):
              p = Path(name)
              if not p.exists():
                  continue

              text = p.read_text(encoding='utf-8')
              pos = text.find(marker)
              if pos < 0:
                  continue

              # Find the nearest opening section/article/div before the heading,
              # then remove that complete block through its matching closing tag.
              starts = [(text.rfind('<section', 0, pos), 'section'),
                        (text.rfind('<article', 0, pos), 'article'),
                        (text.rfind('<div', 0, pos), 'div')]
              start, tag = max(starts, key=lambda x: x[0])
              if start < 0:
                  continue

              pattern = re.compile(rf'<{tag}\\b[^>]*>|</{tag}>', re.I)
              depth = 0
              end = None
              for m in pattern.finditer(text, start):
                  token = m.group(0).lower()
                  if token.startswith(f'<{tag}'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = m.end()
                          break

              if end is not None and start < end:
                  text = text[:start] + text[end:]
                  p.write_text(text, encoding='utf-8')

      - name: Remove workflow and commit
        shell: bash
        run: |
          git config user.name 'GetNick UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/remove-seo-block.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Remove SEO content block from main pages'
            git push
          fi