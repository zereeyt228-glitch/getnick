name: Add generator buttons to About

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/update-about-generators.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update about buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('about.html')
          text = p.read_text(encoding='utf-8')

          if 'Перейти к генератору паролей' not in text:
              pattern = re.compile(
                  r'<a\b[^>]*href=["\'](?:\.\.?/)?mainmenu\.html["\'][^>]*>.*?Перейти к генератору.*?</a>',
                  re.IGNORECASE | re.DOTALL,
              )

              replacement = '''
          <div class="about-generator-actions" style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:1.5rem;">
              <a href="mainmenu.html" class="btn btn-primary">
                  <i class="fa-solid fa-wand-magic-sparkles"></i> Перейти к генератору ников
              </a>
              <a href="generator-paroley.html" class="btn btn-secondary">
                  <i class="fa-solid fa-key"></i> Перейти к генератору паролей
              </a>
          </div>'''

              new_text, count = pattern.subn(replacement, text, count=1)
              if count == 0:
                  raise SystemExit('Existing generator button was not found in about.html')
              p.write_text(new_text, encoding='utf-8')
          else:
              print('Buttons already added; nothing to do.')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'GetNick UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add about.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Add nick and password generator buttons to About'
            git push
          fi
